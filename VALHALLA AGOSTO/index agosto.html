<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Costão — Novidades em Breve</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #070708;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated ember particles */
        .embers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .ember {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #c9a227;
            border-radius: 50%;
            opacity: 0;
            animation: rise linear infinite;
            box-shadow: 0 0 6px #c9a227, 0 0 12px #e63946;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Vignette overlay */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            max-width: 700px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo-wrapper {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(201,162,39,0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .logo {
            max-width: 100%;
            width: 420px;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(201,162,39,0.3)) drop-shadow(0 10px 40px rgba(0,0,0,0.8));
            animation: logoPulse 4s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(201,162,39,0.3)) drop-shadow(0 10px 40px rgba(0,0,0,0.8)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 50px rgba(201,162,39,0.5)) drop-shadow(0 10px 40px rgba(0,0,0,0.8)); }
        }

        /* Divider rune line */
        .rune-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            color: #8a7e5c;
            font-size: 1.2rem;
            letter-spacing: 8px;
        }

        .rune-divider::before,
        .rune-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #8a7e5c, transparent);
            max-width: 120px;
        }

        /* Main headline */
        .headline {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            color: #c9a227;
            text-transform: uppercase;
            letter-spacing: 6px;
            line-height: 1.2;
            margin-bottom: 15px;
            text-shadow:
                0 0 20px rgba(201,162,39,0.4),
                0 2px 4px rgba(0,0,0,0.8),
                0 0 60px rgba(201,162,39,0.1);
            position: relative;
        }

        /* Subtitle */
        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.95rem, 2.5vw, 1.15rem);
            font-weight: 300;
            color: #a09880;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Loading / pulse indicator */
        .pulse-ring {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #c9a227;
            border-radius: 50%;
            position: relative;
            margin-bottom: 30px;
        }

        .pulse-ring::before,
        .pulse-ring::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(201,162,39,0.4);
            animation: pulse 2s ease-out infinite;
        }

        .pulse-ring::after {
            animation-delay: 1s;
        }

        @keyframes pulse {
            0% { width: 12px; height: 12px; opacity: 1; }
            100% { width: 60px; height: 60px; opacity: 0; }
        }

        /* Footer text */
        .footer {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .footer p {
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Decorative corner runes */
        .corner {
            position: fixed;
            width: 80px;
            height: 80px;
            z-index: 5;
            opacity: 0.15;
            pointer-events: none;
        }

        .corner-tl { top: 20px; left: 20px; border-top: 2px solid #c9a227; border-left: 2px solid #c9a227; }
        .corner-tr { top: 20px; right: 20px; border-top: 2px solid #c9a227; border-right: 2px solid #c9a227; }
        .corner-bl { bottom: 20px; left: 20px; border-bottom: 2px solid #c9a227; border-left: 2px solid #c9a227; }
        .corner-br { bottom: 20px; right: 20px; border-bottom: 2px solid #c9a227; border-right: 2px solid #c9a227; }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .logo { width: 280px; }
            .headline { letter-spacing: 3px; }
            .rune-divider { font-size: 1rem; letter-spacing: 4px; }
        }
    </style>
</head>

        for (let i = 0; i < emberCount; i++) {
            const ember = document.createElement('div');
            ember.className = 'ember';
            ember.style.left = Math.random() * 100 + '%';
            ember.style.animationDuration = (Math.random() * 4 + 3) + 's';
            ember.style.animationDelay = (Math.random() * 5) + 's';
            ember.style.width = (Math.random() * 3 + 1) + 'px';
            ember.style.height = ember.style.width;
            embersContainer.appendChild(ember);
        }
    </script>
</body>
</html>
